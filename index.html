<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Bug Bounty Vault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============ Design Tokens (الثيمات بتتعدل من هنا) ============ */
:root{
  --bg:#060a11; --surface:#0e1626; --inner:#0a101d; --border:#1b2942;
  --text:#e7edf6; --muted:#8fa0b8;
  --accent:#34d399; --accent2:#22d3ee; --accent-dim:rgba(52,211,153,.12);
  --glow1:rgba(52,211,153,.10); --glow2:rgba(34,211,238,.07);
  --amber:#fbbf24; --amber-dim:rgba(251,191,36,.12);
  --red:#f87171; --blue:#60a5fa; --blue-dim:rgba(96,165,250,.12);
  --mono:ui-monospace,'Cascadia Code',Consolas,monospace;
}
body[data-theme="ocean"]{--accent:#38bdf8;--accent2:#818cf8;--accent-dim:rgba(56,189,248,.12);--glow1:rgba(56,189,248,.10);--glow2:rgba(129,140,248,.08);--surface:#0d1526;--inner:#0a101c;--border:#1c2a44}
body[data-theme="sunset"]{--accent:#fb7185;--accent2:#c084fc;--accent-dim:rgba(251,113,133,.12);--glow1:rgba(251,113,133,.10);--glow2:rgba(192,132,252,.08);--bg:#0c0810;--surface:#160f1d;--inner:#100a17;--border:#2b1e33}
body[data-theme="light"]{--bg:#eef2f8;--surface:#fff;--inner:#f4f7fb;--border:#dfe6f0;--text:#17202f;--muted:#5f6f85;--accent:#0aa678;--accent2:#0369a1;--accent-dim:rgba(10,166,120,.12);--glow1:rgba(10,166,120,.12);--glow2:rgba(3,105,161,.08);--amber:#b45309;--red:#dc2626;--blue:#2563eb}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Cairo',Tahoma,sans-serif;min-height:100vh}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(700px 420px at 88% -8%,var(--glow1),transparent),
             radial-gradient(600px 400px at -8% 100%,var(--glow2),transparent)}
button{font-family:inherit;cursor:pointer}
a{color:var(--accent2);text-decoration:none}
::selection{background:var(--accent-dim)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:9px}

/* ============ Layout ============ */
.app{display:flex;min-height:100vh;position:relative;z-index:1}
.sidebar{width:236px;flex-shrink:0;border-inline-end:1px solid var(--border);background:rgba(0,0,0,.18);
  display:flex;flex-direction:column;padding:20px 14px;position:sticky;top:0;height:100vh}
.brand{font-size:17px;font-weight:800;padding:2px 10px 18px;display:flex;align-items:center;gap:8px}
.brand small{display:block;font-size:10.5px;color:var(--muted);font-weight:400}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:11px;color:var(--muted);
  font-size:13.5px;font-weight:700;transition:.18s;border:1px solid transparent}
.nav a:hover{color:var(--text);background:var(--inner)}
.nav a.active{color:var(--accent);background:var(--accent-dim);border-color:rgba(52,211,153,.25)}
.side-foot{margin-top:auto;display:flex;align-items:center;gap:12px;padding:12px 8px 0;border-top:1px solid var(--border)}
.iconbtn{background:var(--inner);border:1px solid var(--border);color:var(--muted);width:34px;height:34px;border-radius:10px;font-size:15px;display:inline-flex;align-items:center;justify-content:center}
.iconbtn:hover{color:var(--accent);border-color:var(--accent)}
.ver{font-size:10.5px;color:var(--muted)}

main{flex:1;min-width:0}
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;padding:14px 28px;
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
#routeTitle{font-size:16px;font-weight:800;flex:1}
.tb-actions{display:flex;gap:8px}
#view{padding:26px 28px 60px;max-width:1060px;margin:auto}
.view{animation:fadeUp .35s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ============ Components ============ */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px 22px;margin-bottom:16px}
.panel h3{font-size:15px;margin-bottom:10px}
.hint{font-size:12.5px;color:var(--muted);line-height:1.9;margin-bottom:12px}
.btn{background:var(--inner);border:1px solid var(--border);color:var(--text);padding:9px 18px;border-radius:11px;font-size:13px;font-weight:700;transition:.18s;display:inline-flex;align-items:center;gap:7px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#04110b}
.btn.primary:hover{filter:brightness(1.1);color:#04110b}
.btn.danger:hover{border-color:var(--red);color:var(--red)}
.btn.sm{padding:6px 12px;font-size:12px;border-radius:9px}
.inp{width:100%;background:var(--inner);border:1px solid var(--border);border-radius:11px;color:var(--text);
  padding:10px 14px;font-size:13px;font-family:inherit;transition:.18s}
.inp:focus{outline:none;border-color:var(--accent)}
textarea.inp{resize:vertical;min-height:110px;font-family:var(--mono);font-size:12px;direction:ltr;text-align:left}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.fgrid label{font-size:11.5px;color:var(--muted);font-weight:700;display:block;margin-bottom:5px}

.hero{display:flex;align-items:center;gap:26px;flex-wrap:wrap}
.hero .htxt{flex:1;min-width:240px}
.hero h2{font-size:22px;margin-bottom:6px}
.hero .sub{color:var(--muted);font-size:13px;line-height:1.9;margin-bottom:14px}
.quote{font-size:12.5px;color:var(--muted);border-inline-start:3px solid var(--accent);padding-inline-start:12px;margin-top:14px;font-style:italic}
.ring{position:relative;display:grid;place-items:center}
.ring svg{transform:rotate(-90deg);position:absolute;inset:0}
.ring span{font-weight:800;color:var(--accent)}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:18px 0}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 18px}
.stat b{font-size:26px;display:block;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);font-weight:700}
.stat.g b{color:var(--accent)} .stat.a b{color:var(--amber)} .stat.bl b{color:var(--blue)}
.stagebar{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:11px 16px;margin-bottom:9px;transition:.18s}
.stagebar:hover{border-color:var(--accent)}
.stagebar .t{flex:1;font-size:13px;font-weight:700}
.bar{width:150px;height:7px;background:var(--inner);border-radius:6px;overflow:hidden;flex-shrink:0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:6px;transition:width .4s}
.pct{font-size:11.5px;color:var(--accent);font-weight:800;width:36px;text-align:center}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.chip{background:transparent;border:1px solid var(--border);color:var(--muted);padding:6px 15px;border-radius:20px;font-size:12px;font-weight:700;transition:.15s}
.chip.on{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}
.toolbar .inp{max-width:240px}

.stage{background:var(--surface);border:1px solid var(--border);border-radius:15px;margin-bottom:13px;overflow:hidden}
.stage-head{display:flex;align-items:center;gap:11px;padding:13px 18px;cursor:pointer;user-select:none}
.stage-head:hover{background:var(--inner)}
.chev{color:var(--muted);transition:.25s;font-size:12px}
.stage.closed .chev{transform:rotate(-90deg)}
.stage.closed .stage-body{display:none}
.stage-body{padding:2px 14px 14px;display:flex;flex-direction:column;gap:8px}
.sicon{font-size:20px}
.sinfo{flex:1;min-width:150px}
.sinfo b{font-size:14px;display:block}
.sinfo small{color:var(--muted);font-size:11.5px}

.lesson{display:flex;align-items:center;gap:10px;background:var(--inner);border:1px solid var(--border);border-radius:12px;padding:9px 13px;transition:.18s}
.lesson:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--border))}
.lesson.doing{border-color:rgba(251,191,36,.45)}
.lesson.done{border-color:rgba(52,211,153,.45)}
.lmain{flex:1;min-width:140px;cursor:pointer}
.lmain:hover .lname{color:var(--accent)}
.lname{font-size:13px;font-weight:700;transition:.15s}
.lpath{font-size:10.5px;color:var(--muted);font-family:var(--mono);direction:ltr;text-align:right}
.badge{font-size:10.5px;padding:2px 9px;border-radius:12px;border:1px solid var(--border);color:var(--muted);white-space:nowrap}
.badge.done{color:var(--accent);border-color:rgba(52,211,153,.4);background:var(--accent-dim)}
.badge.doing{color:var(--amber);border-color:rgba(251,191,36,.4);background:var(--amber-dim)}
.badge.note{color:var(--blue);border-color:rgba(96,165,250,.4);background:var(--blue-dim)}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:10px;overflow:hidden;flex-shrink:0}
.seg button{background:transparent;border:none;border-inline-end:1px solid var(--border);color:var(--muted);padding:5px 11px;font-size:11px;font-weight:700;transition:.15s}
.seg button:last-child{border-inline-end:none}
.seg button[data-st="todo"].on{background:var(--blue-dim);color:var(--blue)}
.seg button[data-st="doing"].on{background:var(--amber-dim);color:var(--amber)}
.seg button[data-st="done"].on{background:var(--accent-dim);color:var(--accent)}
.addrow{display:flex;justify-content:flex-start;padding-top:2px}

.empty{border:1px dashed var(--border);border-radius:12px;padding:16px 18px;font-size:12.5px;color:var(--muted);line-height:2}
.empty b{color:var(--accent)}

.note-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.note-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.18s}
.note-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.nt{font-size:13.5px;font-weight:800;margin-bottom:6px}
.np{font-size:12px;color:var(--muted);line-height:1.8;max-height:72px;overflow:hidden}
.nm{font-size:10.5px;color:var(--muted);font-family:var(--mono);direction:ltr;text-align:left;margin-top:8px;opacity:.7}

.themes{display:flex;gap:12px;flex-wrap:wrap}
.tsw{border:1px solid var(--border);background:var(--inner);border-radius:12px;padding:10px 16px;font-size:12.5px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:9px;transition:.18s}
.tsw:hover{border-color:var(--accent)}
.tsw.on{border-color:var(--accent);color:var(--accent);background:var(--accent-dim)}
.dot{width:16px;height:16px;border-radius:50%;background:linear-gradient(135deg,var(--sw1),var(--sw2))}

/* ============ Modal ============ */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.66);backdrop-filter:blur(4px);display:none;z-index:100;padding:22px 14px;overflow-y:auto}
#modal.show{display:block}
.mbox{max-width:860px;margin:0 auto 40px;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:24px;position:relative;animation:fadeUp .3s ease both}
.mclose{position:absolute;top:14px;left:14px;width:34px;height:34px;border-radius:10px;background:var(--inner);border:1px solid var(--border);color:var(--muted)}
.mclose:hover{color:var(--red)}
#mTitle{font-size:19px;padding-inline-end:44px}
#mPath{font-size:11.5px;color:var(--muted);font-family:var(--mono);direction:ltr;text-align:left;margin:4px 0 14px}
.mrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.md{background:var(--inner);border:1px solid var(--border);border-radius:13px;padding:20px 24px;line-height:2.1;font-size:14px;margin-bottom:16px}
.md h1{font-size:20px;color:var(--accent);margin:18px 0 8px}.md h1:first-child{margin-top:0}
.md h2{font-size:17px;margin:14px 0 6px}.md h3{font-size:15px;margin:12px 0 4px}
.md ul,.md ol{padding-inline-start:24px}.md li{margin:3px 0}
.md code{background:var(--bg);padding:2px 7px;border-radius:6px;font-family:var(--mono);font-size:12px;color:var(--accent2);direction:ltr;display:inline-block}
.md pre{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:14px;overflow:auto;direction:ltr;text-align:left;margin:12px 0}
.md pre code{background:none;padding:0}
.md table{border-collapse:collapse;width:100%;margin:12px 0;display:block;overflow:auto}
.md th,.md td{border:1px solid var(--border);padding:7px 12px;font-size:13px}
.md blockquote{border-inline-start:3px solid var(--accent);padding-inline-start:14px;color:var(--muted);margin:10px 0}
.md img{max-width:100%;border-radius:9px}
.mnotes label{font-size:13px;font-weight:800;display:block;margin-bottom:7px}
.mnotes small{color:var(--muted);font-weight:400}
.savehint{font-size:11.5px;color:var(--muted);min-height:16px;margin-top:5px}
.savehint.saved{color:var(--accent)}
.load{text-align:center;color:var(--muted);padding:36px 0;font-size:13px}

#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--surface);
  border:1px solid var(--accent);color:var(--accent);padding:10px 24px;border-radius:12px;font-size:13px;font-weight:700;opacity:0;transition:.3s;z-index:200;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:880px){
  .app{display:block}
  .sidebar{width:auto;height:auto;position:static;flex-direction:row;align-items:center;padding:10px 14px;gap:10px;border-inline-end:none;border-bottom:1px solid var(--border)}
  .brand{padding:0}.brand small{display:none}
  .nav{flex-direction:row;overflow-x:auto;flex:1}
  .nav a{white-space:nowrap;padding:8px 12px}
  .side-foot{margin:0;border:none;padding:0}
  #view{padding:18px 14px 60px}
  .topbar{padding:12px 14px}
  .bar{display:none}
  .lesson{flex-wrap:wrap}
  .fgrid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="brand">🎯 Bug Bounty Vault<small>نظام متابعة مسارك</small></div>
    <nav class="nav">
      <a href="#/dashboard" data-route="dashboard">📊 لوحة التحكم</a>
      <a href="#/curriculum" data-route="curriculum">📚 المنهج</a>
      <a href="#/notes" data-route="notes">✍️ ملاحظاتي</a>
      <a href="#/settings" data-route="settings">⚙️ الإعدادات</a>
    </nav>
    <div class="side-foot">
      <div class="ring" id="sideRing" style="width:44px;height:44px"></div>
      <button class="iconbtn" id="themeCycle" title="تبديل الثيم">🎨</button>
      <span class="ver">v2.0</span>
    </div>
  </aside>

  <main>
    <div class="topbar">
      <div id="routeTitle">لوحة التحكم</div>
      <div class="tb-actions">
        <button class="iconbtn" id="tbRefresh" title="تحديث من GitHub">🔄</button>
        <a class="iconbtn" id="tbGh" href="#" target="_blank" title="فتح الريبو">📁</a>
      </div>
    </div>
    <div id="view"><div class="load">جاري التحميل…</div></div>
  </main>
</div>

<div id="modal"><div class="mbox">
  <button class="mclose" id="mClose">✕</button>
  <h3 id="mTitle"></h3><div id="mPath"></div>
  <div class="mrow">
    <div class="seg" id="mSeg" data-path=""><button data-st="todo">لم يبدأ</button><button data-st="doing">جاري</button><button data-st="done">تم ✓</button></div>
    <a class="btn sm" id="mEdit" href="#" target="_blank">✏️ GitHub</a>
    <button class="btn sm" id="mReload">🔄 إعادة تحميل</button>
  </div>
  <article class="md" id="mContent"></article>
  <div class="mnotes">
    <label>✍️ شرحي الشخصي — بكلامي أنت <small>(يُحفظ تلقائيًا)</small></label>
    <textarea class="inp" id="mNotes" style="min-height:130px" placeholder="اكتب اللي فهمته بكلامك… اللي بتكتبه بإيدك بيفهمه بدماغك"></textarea>
    <div class="savehint" id="mHint"></div>
  </div>
</div></div>

<input type="file" id="importInput" accept=".json" hidden>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<script>
/* ═══════════════════════════════════════════════
   المعمار: CONFIG → STORE → GH(API) → VIEWS → ROUTER
   لإضافة View جديد: Views.myview = {title, render}
   لإضافة مرحلة:     من الإعدادات (JSON) أو عدّل DEF_STAGES
   لإضافة ثيم:       بلوك CSS + سطر في THEMES
═══════════════════════════════════════════════ */

/* ============ 1) CONFIG ============ */
const DEF_STAGES=[
 {icon:"🗺️",title:"خريطة الطريق",weeks:"قبل ما تبدأ",dir:"01-roadmap"},
 {icon:"🧱",title:"الأساسيات",weeks:"أسابيع 1-4",dir:"02-foundations"},
 {icon:"🔍",title:"التعمق في IDOR",weeks:"أسابيع 5-7",dir:"03-idor-deepdive"},
 {icon:"🎯",title:"الصيد الحقيقي",weeks:"أسابيع 8-12",dir:"04-hunting"},
 {icon:"🧪",title:"اللابات",weeks:"موازي مع الكل",dir:"05-labs"},
 {icon:"📝",title:"اختبار نفسك",weeks:"نهاية كل مرحلة",dir:"06-assessment"},
];
const THEMES={emerald:"زمردي",ocean:"محيطي",sunset:"غروب",light:"نهاري"};
const LS="bounty_vault_v2";

let cfg={owner:"",repo:"",branch:"main",token:"",theme:"emerald",stages:DEF_STAGES};
let store={progress:{},notes:{},lastDone:null,lastOpened:null};

function saveAll(){try{localStorage.setItem(LS,JSON.stringify({cfg,store}))}catch(e){}}
function loadAll(){
  try{const r=JSON.parse(localStorage.getItem(LS)||"null");
    if(r){cfg={...cfg,...r.cfg};store={...store,...r.store};}
  }catch(e){}
  if(!Array.isArray(cfg.stages)||!cfg.stages.length)cfg.stages=DEF_STAGES;
}
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const pretty=n=>n.replace(/\.md$/i,"").replace(/^\d+\s*[-_.]?\s*/,"").replace(/[-_]+/g," ").trim();
const statusOf=p=>store.progress[p]||"todo";
const ghUrl=(...p)=>`https://github.com/${cfg.owner}/${cfg.repo}/${p.join("/")}`;
const editUrl=path=>cfg.owner?ghUrl("edit",cfg.branch,path):"#";
const toast=m=>{const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove("show"),2200)};

/* ============ 2) STORE — الثيم ============ */
function applyTheme(){document.body.dataset.theme=cfg.theme}

/* ============ 3) GH — طبقة GitHub API الوحيدة ============ */
const contentCache=new Map();
const GH={
  ttl:15*60*1000,
  headers(extra={}){const h={...extra};if(cfg.token)h.Authorization="Bearer "+cfg.token;return h},
  async api(url){const r=await fetch(url,{headers:this.headers()});if(!r.ok)throw new Error(r.status);return r.json()},
  async raw(path){
    if(contentCache.has(path))return contentCache.get(path);
    const r=await fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${path}?ref=${cfg.branch}`,
      {headers:this.headers({Accept:"application/vnd.github.raw"})});
    if(!r.ok)throw new Error(r.status);
    const md=await r.text();contentCache.set(path,md);return md;
  },
  async listDir(dir){
    const ck=`ghc_${cfg.owner}/${cfg.repo}/${cfg.branch}/${dir}`;
    try{const raw=sessionStorage.getItem(ck);
      if(raw){const{ts,items}=JSON.parse(raw);if(Date.now()-ts<this.ttl)return items}
    }catch(e){}
    const items=await this.api(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/content/${dir}?ref=${cfg.branch}`);
    const files=(Array.isArray(items)?items:[]).filter(i=>i.type==="file"&&/\.md$/i.test(i.name))
      .sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}))
      .map(i=>({name:i.name,path:i.path}));
    try{sessionStorage.setItem(ck,JSON.stringify({ts:Date.now(),items:files}))}catch(e){}
    return files;
  }
};
function invalidate(){
  contentCache.clear();
  try{Object.keys(sessionStorage).filter(k=>k.startsWith("ghc_")).forEach(k=>sessionStorage.removeItem(k))}catch(e){}
}

/* ============ 4) المنهج (كاش واحد لكل الـ Views) ============ */
const LESSONS=new Map();
let CURR=null;
async function getCurriculum(force=false){
  if(CURR&&!force&&Date.now()-CURR.ts<GH.ttl)return CURR;
  LESSONS.clear();
  const stages=[];
  for(const s of cfg.stages){
    let lessons=[],error=null;
    try{lessons=await GH.listDir(s.dir)}
    catch(e){
      error=e.message==="rate"?"Rate Limit — خلصت حصة الطلبات المؤقتة، استنى دقيقة ودوس 🔄"
        :e.message==="404"?`فولدر <b>content/${esc(s.dir)}/</b> مش موجود في الريبو — اعمله وحط فيه ملفات <b>.md</b>`
        :e.message==="401"?"التوكن غير صالح — راجع الإعدادات"
        :"مشكلة اتصال — راجع اسم الريبو/التوكن في الإعدادات";
    }
    stages.push({...s,lessons,error});
    lessons.forEach(l=>LESSONS.set(l.path,{...l,title:pretty(l.name),stage:s}));
  }
  CURR={ts:Date.now(),stages};
  return CURR;
}
function stats(){
  let total=0,done=0,doing=0,notes=0;
  if(CURR)CURR.stages.forEach(s=>s.lessons.forEach(l=>{
    total++;const st=statusOf(l.path);
    if(st==="done")done++;else if(st==="doing")doing++;
    if((store.notes[l.path]||"").trim())notes++;
  }));
  return{total,done,doing,notes,pct:total?Math.round(done/total*100):0};
}
function ringHTML(size,pct){
  const r=(size-10)/2,c=+(2*Math.PI*r).toFixed(2);
  return `<svg width="${size}" height="${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--inner)" stroke-width="7"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--accent)" stroke-width="7"
      stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${(c*(1-pct/100)).toFixed(2)}"/></svg>
    <span style="font-size:${size/5.5}px">${pct}%</span>`;
}
function updateRing(){
  const s=stats();
  document.getElementById("sideRing").innerHTML=ringHTML(44,s.pct);
  const h=document.getElementById("heroRing");if(h)h.innerHTML=ringHTML(128,s.pct);
}

/* ─── المنهج ─── */
Views.curriculum={
  title:"📚 المنهج",
  async render(v){
    v.innerHTML='<div class="load">جاري قراءة الريبو…</div>';
    await getCurriculum();
    v.innerHTML=`<div class="view">
      <div class="toolbar">
        <input class="inp" id="q" placeholder="🔎 دوّر على درس…" value="${esc(q)}">
        <button class="chip ${f==="all"?"on":""}" data-filter="all">الكل</button>
        <button class="chip ${f==="todo"?"on":""}" data-filter="todo">لم يبدأ</button>
        <button class="chip ${f==="doing"?"on":""}" data-filter="doing">جاري</button>
        <button class="chip ${f==="done"?"on":""}" data-filter="done">تم ✓</button>
      </div>
      <div id="stageList"></div></div>`;
    document.getElementById("q").oninput=e=>{q=e.target.value;clearTimeout(window._qt);window._qt=setTimeout(()=>stageListFn&&stageListFn(),180)};
    stageListFn=renderStageList;
    renderStageList();updateRing();
  }
};
function renderStageList(){
  const el=document.getElementById("stageList");if(!el)return;
  el.innerHTML=CURR.stages.map((s,si)=>{
    let list=s.lessons;
    if(q)list=list.filter(l=>l.name.toLowerCase().includes(q.toLowerCase())||l.path.toLowerCase().includes(q.toLowerCase()));
    if(f!=="all")list=list.filter(l=>statusOf(l.path)===f);
    const d=s.lessons.filter(l=>statusOf(l.path)==="done").length;
    const p=s.lessons.length?Math.round(d/s.lessons.length*100):0;
    const open=(s.lessons.some(l=>statusOf(l.path)==="doing")||si===0)&&!s.error;
    let body;
    if(s.error)body=`<div class="empty">${s.error}</div>`;
    else if(!s.lessons.length)body=`<div class="empty">الفولدر فاضي — <b>اعمل ملف .md</b> في <b style="font-family:var(--mono)">content/${esc(s.dir)}/</b> على GitHub وهيظهر هنا بعد 🔄</div>`;
    else body=list.map(l=>{
      const st=statusOf(l.path);
      return `<div class="lesson ${st}">
        <div class="lmain" data-open="${esc(l.path)}"><div class="lname">📄 ${esc(pretty(l.name))}</div><div class="lpath">${esc(l.path)}</div></div>
        <div>${(store.notes[l.path]||"").trim()?'<span class="badge note">✍️ شرح</span>':""}
             ${st==="done"?'<span class="badge done">✓</span>':st==="doing"?'<span class="badge doing">⚡</span>':""}</div>
        <div class="seg" data-path="${esc(l.path)}">
          <button data-st="todo" class="${st==="todo"?"on":""}">لم يبدأ</button>
          <button data-st="doing" class="${st==="doing"?"on":""}">جاري</button>
          <button data-st="done" class="${st==="done"?"on":""}">تم</button>
        </div>
        <a class="iconbtn" style="width:30px;height:30px;font-size:13px" href="${editUrl(l.path)}" target="_blank" title="تعديل">✏️</a>
      </div>`;
    }).join("")||`<div class="empty">مفيش نتائج للبحث/الفيلتر ده</div>`;
    return `<section class="stage ${open?"":"closed"}">
      <div class="stage-head"><span class="chev">▾</span><span class="sicon">${s.icon}</span>
        <div class="sinfo"><b>${esc(s.title)}</b><small>${esc(s.weeks)} • ${s.lessons.length} درس</small></div>
        <div class="bar"><i style="width:${p}%"></i></div><span class="pct">${p}%</span></div>
      <div class="stage-body">${body}
        <div class="addrow"><a class="btn sm" href="${cfg.owner?ghUrl("new",cfg.branch,"content/"+s.dir):"#"}" target="_blank">➕ درس جديد</a></div>
      </div></section>`;
  }).join("");
}

/* ============ 6) ROUTER ============ */
let current="dashboard";
async function renderRoute(){
  current=(location.hash||"#/dashboard").replace(/^#\//,"");
  if(!Views[current])current="dashboard";
  document.querySelectorAll(".nav a").forEach(a=>a.classList.toggle("active",a.dataset.route===current));
  document.getElementById("routeTitle").textContent=Views[current].title;
  document.getElementById("tbGh").href=cfg.owner?ghUrl(""):"#";
  const v=document.getElementById("view");
  try{await Views[current].render(v)}
  catch(e){v.innerHTML=`<div class="empty">حصل خطأ: ${esc(e.message)}</div>`}
  updateRing();
}
window.addEventListener("hashchange",renderRoute);

/* ============ 7) المودال (الدرس) ============ */
let modalPath=null;
async function openLesson(path){
  modalPath=path;
  const L=LESSONS.get(path);
  const title=L?L.title:pretty(path.split("/").pop());
  store.lastOpened=path;saveAll();
  document.getElementById("mTitle").textContent="📄 "+title;
  document.getElementById("mPath").textContent=path;
  document.getElementById("mEdit").href=editUrl(path);
  const seg=document.getElementById("mSeg");seg.dataset.path=path;
  refreshModalSeg();
  const ta=document.getElementById("mNotes");ta.value=store.notes[path]||"";
  document.getElementById("mHint").textContent="";
  const box=document.getElementById("mContent");
  box.innerHTML='<div class="load">جاري تحميل المحتوى من الريبو…</div>';
  document.getElementById("modal").classList.add("show");
  try{
    const md=await GH.raw(path);
    box.innerHTML=DOMPurify.sanitize(marked.parse(md,{breaks:true}));
    box.querySelectorAll("a").forEach(a=>{a.target="_blank";a.rel="noopener"});
  }catch(e){box.innerHTML=`<div class="empty">تعذر تحميل المحتوى (${esc(e.message)}) — دوس 🔄 إعادة تحميل أو راجع الإعدادات.</div>`}
}
function refreshModalSeg(){
  const st=statusOf(modalPath);
  document.querySelectorAll("#mSeg button").forEach(b=>b.classList.toggle("on",b.dataset.st===st));
}
function closeModal(){document.getElementById("modal").classList.remove("show");modalPath=null;renderRoute()}

/* ============ 8) الأحداث (Delegation موحد) ============ */
document.addEventListener("click",e=>{
  const t=e.target;
  const route=t.closest("[data-route]");if(route){e.preventDefault();location.hash="#/"+route.dataset.route;return}
  const open=t.closest("[data-open]");if(open){openLesson(open.dataset.open);return}
  const segBtn=t.closest(".seg button");
  if(segBtn){
    const path=segBtn.closest(".seg").dataset.path,st=segBtn.dataset.st;
    if(st==="done")store.lastDone=Date.now();
    store.progress[path]=st;saveAll();
    if(document.getElementById("modal").classList.contains("show")&&modalPath===path)refreshModalSeg();
    renderRoute();return;
  }
  const chip=t.closest("[data-filter]");
  if(chip){f=chip.dataset.filter;
    document.querySelectorAll("[data-filter]").forEach(c=>c.classList.toggle("on",c===chip));
    stageListFn&&stageListFn();return}
  const themeBtn=t.closest("[data-theme-set]");
  if(themeBtn){cfg.theme=themeBtn.dataset.themeSet;saveAll();applyTheme();renderRoute();return}
  if(t.closest("#themeCycle")){const ks=Object.keys(THEMES);
    cfg.theme=ks[(ks.indexOf(cfg.theme)+1)%ks.length];saveAll();applyTheme();renderRoute();return}
  const head=t.closest(".stage-head");if(head){head.closest(".stage").classList.toggle("closed");return}
  if(t.closest("#mReload")&&modalPath){contentCache.delete(modalPath);openLesson(modalPath);return}
  if(t.closest("#mClose")){closeModal();return}
  if(t.id==="modal"){closeModal();return}
});
document.getElementById("tbRefresh").onclick=()=>{invalidate();renderRoute();toast("🔄 اتحمّل من الريبو تاني")};
document.getElementById("mNotes").oninput=e=>{
  if(!modalPath)return;store.notes[modalPath]=e.target.value;saveAll();
  const h=document.getElementById("mHint");h.textContent="💾 اتحفظ";h.classList.add("saved");
  clearTimeout(window._nh);window._nh=setTimeout(()=>{h.textContent=""},1400);
};
document.getElementById("importInput").onchange=e=>{
  const file=e.target.files[0];if(!file)return;
  const r=new FileReader();
  r.onload=()=>{try{const j=JSON.parse(r.result);
    if(j.cfg)cfg={...cfg,...j.cfg};if(j.store)store={...store,...j.store};
    saveAll();applyTheme();invalidate();renderRoute();toast("⬆️ اترستوردت");
  }catch(err){toast("❌ الملف مش صحيح")}};
  r.readAsText(file);
};

/* ============ 9) INIT ============ */
loadAll();applyTheme();
window.Vault={Views,cfg,store,GH};   // متاح في الـ Console للتطوير
renderRoute();
</script>
