<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>HuntBoard 🏹</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#070c14;--srf:#0f1728;--inr:#0a101d;--brd:#1c2a44;--txt:#e8eef7;--mut:#8ea0b9;
--ac:#34d399;--ac2:#22d3ee;--acd:rgba(52,211,153,.12);--am:#fbbf24;--amd:rgba(251,191,36,.12);
--rd:#f87171;--bl:#60a5fa;--bld:rgba(96,165,250,.12);--mono:ui-monospace,Consolas,monospace}
body[data-theme=ocean]{--ac:#38bdf8;--ac2:#818cf8;--acd:rgba(56,189,248,.12)}
body[data-theme=sunset]{--ac:#fb7185;--ac2:#c084fc;--acd:rgba(251,113,133,.12);--bg:#0c0810;--srf:#170f1e;--inr:#110a18;--brd:#2c1e34}
body[data-theme=light]{--bg:#eef2f8;--srf:#fff;--inr:#f3f6fb;--brd:#dde5f0;--txt:#16202e;--mut:#5c6d84;--ac:#0aa678;--ac2:#0369a1;--acd:rgba(10,166,120,.12);--am:#b45309;--rd:#dc2626;--bl:#2563eb;--bld:rgba(37,99,235,.12)}
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--txt);font-family:Cairo,Tahoma,sans-serif;min-height:100vh}
body::before{content:'';position:fixed;inset:0;pointer-events:none;background:radial-gradient(700px 400px at 90% -8%,var(--acd),transparent),radial-gradient(600px 380px at -8% 102%,rgba(34,211,238,.06),transparent)}
button{font-family:inherit;cursor:pointer}a{color:var(--ac2);text-decoration:none}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--brd);border-radius:9px}
.app{display:flex;min-height:100vh;position:relative;z-index:1}
.side{width:230px;flex-shrink:0;border-inline-end:1px solid var(--brd);background:rgba(0,0,0,.18);display:flex;flex-direction:column;padding:18px 13px;position:sticky;top:0;height:100vh}
.brand{font-size:17px;font-weight:800;padding:2px 10px 16px}.brand small{display:block;font-size:10.5px;color:var(--mut);font-weight:400}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;gap:10px;padding:10px 13px;border-radius:11px;color:var(--mut);font-size:13.5px;font-weight:700;border:1px solid transparent}
.nav a:hover{color:var(--txt);background:var(--inr)}.nav a.on{color:var(--ac);background:var(--acd);border-color:rgba(52,211,153,.25)}
.sfoot{margin-top:auto;display:flex;align-items:center;gap:10px;padding-top:12px;border-top:1px solid var(--brd)}
.ib{background:var(--inr);border:1px solid var(--brd);color:var(--mut);width:34px;height:34px;border-radius:10px;font-size:15px;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.ib:hover{color:var(--ac);border-color:var(--ac)}
main{flex:1;min-width:0}
.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;padding:13px 26px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--brd)}
#rt{font-size:16px;font-weight:800;flex:1}
#view{padding:24px 26px 60px;max-width:1080px;margin:auto}
.vw{animation:fu .3s ease both}@keyframes fu{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
.pnl{background:var(--srf);border:1px solid var(--brd);border-radius:16px;padding:18px 20px;margin-bottom:15px}
.pnl h3{font-size:15px;margin-bottom:10px}.hint{font-size:12.5px;color:var(--mut);line-height:1.9}
.btn{background:var(--inr);border:1px solid var(--brd);color:var(--txt);padding:9px 16px;border-radius:11px;font-size:13px;font-weight:700;display:inline-flex;gap:7px;align-items:center}
.btn:hover{border-color:var(--ac);color:var(--ac)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#04110b}.btn.pri:hover{color:#04110b;filter:brightness(1.1)}
.btn.dng:hover{border-color:var(--rd);color:var(--rd)}
.btn.sm{padding:5px 11px;font-size:12px;border-radius:9px}
.inp{width:100%;background:var(--inr);border:1px solid var(--brd);border-radius:11px;color:var(--txt);padding:10px 13px;font-size:13px;font-family:inherit}
.inp:focus{outline:none;border-color:var(--ac)}
textarea.inp{resize:vertical;min-height:110px;font-family:var(--mono);font-size:12px;direction:ltr;text-align:left}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.fg label{font-size:11.5px;color:var(--mut);font-weight:700;display:block;margin-bottom:5px}
.hero{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.htxt{flex:1;min-width:240px}.hero h2{font-size:21px;margin-bottom:6px}
.ring{position:relative;display:grid;place-items:center}.ring svg{transform:rotate(-90deg);position:absolute;inset:0}
.ring span{font-weight:800;color:var(--ac)}
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:11px;margin:16px 0}
.st{background:var(--srf);border:1px solid var(--brd);border-radius:14px;padding:14px 16px}
.st b{font-size:24px;display:block}.st span{font-size:12px;color:var(--mut);font-weight:700}
.st.g b{color:var(--ac)}.st.a b{color:var(--am)}.st.bl b{color:var(--bl)}
.gb{display:flex;align-items:center;gap:12px;background:var(--srf);border:1px solid var(--brd);border-radius:12px;padding:10px 15px;margin-bottom:8px}
.gb .t{flex:1;font-size:13px;font-weight:700}
.bar{width:140px;height:7px;background:var(--inr);border-radius:6px;overflow:hidden;flex-shrink:0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac2),var(--ac));border-radius:6px;transition:width .4s}
.pct{font-size:11.5px;color:var(--ac);font-weight:800;width:36px;text-align:center}
.tools{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:15px}
.tools .inp{max-width:230px}
.chip{background:none;border:1px solid var(--brd);color:var(--mut);padding:6px 14px;border-radius:20px;font-size:12px;font-weight:700}
.chip.on{background:var(--acd);border-color:var(--ac);color:var(--ac)}
.grp{background:var(--srf);border:1px solid var(--brd);border-radius:15px;margin-bottom:12px;overflow:hidden}
.gh{display:flex;align-items:center;gap:11px;padding:12px 16px;cursor:pointer;user-select:none}
.gh:hover{background:var(--inr)}.chev{color:var(--mut);transition:.25s;font-size:12px}
.grp.cl .chev{transform:rotate(-90deg)}.grp.cl .gb2{display:none}
.gb2{padding:2px 12px 12px;display:flex;flex-direction:column;gap:7px}
.gi{font-size:19px}.gi2{flex:1;min-width:130px}.gi2 b{font-size:13.5px;display:block}.gi2 small{color:var(--mut);font-size:11.5px}
.row{display:flex;align-items:center;gap:9px;background:var(--inr);border:1px solid var(--brd);border-radius:12px;padding:8px 12px;flex-wrap:wrap}
.row:hover{border-color:color-mix(in srgb,var(--ac) 45%,var(--brd))}
.row.doing{border-color:rgba(251,191,36,.45)}.row.done{border-color:rgba(52,211,153,.45)}
.ric{font-size:17px;width:24px;text-align:center}
.rm{flex:1;min-width:130px;cursor:pointer}.rm:hover .rn{color:var(--ac)}
.rn{font-size:13px;font-weight:700}.rp{font-size:10px;color:var(--mut);font-family:var(--mono);direction:ltr;text-align:right;word-break:break-all}
.bdg{font-size:10.5px;padding:2px 8px;border-radius:12px;border:1px solid var(--brd);color:var(--mut);white-space:nowrap}
.bdg.done{color:var(--ac);border-color:rgba(52,211,153,.4);background:var(--acd)}
.bdg.doing{color:var(--am);border-color:rgba(251,191,36,.4);background:var(--amd)}
.bdg.note{color:var(--bl);border-color:rgba(96,165,250,.4);background:var(--bld)}
.seg{display:inline-flex;border:1px solid var(--brd);border-radius:10px;overflow:hidden;flex-shrink:0}
.seg button{background:none;border:none;border-inline-end:1px solid var(--brd);color:var(--mut);padding:5px 10px;font-size:11px;font-weight:700}
.seg button:last-child{border-inline-end:none}
.seg button.on[data-st=todo]{background:var(--bld);color:var(--bl)}
.seg button.on[data-st=doing]{background:var(--amd);color:var(--am)}
.seg button.on[data-st=done]{background:var(--acd);color:var(--ac)}
.emp{border:1px dashed var(--brd);border-radius:12px;padding:15px 17px;font-size:12.5px;color:var(--mut);line-height:2}
.emp b{color:var(--ac)}
.ngrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:11px}
.nc{background:var(--srf);border:1px solid var(--brd);border-radius:14px;padding:15px;cursor:pointer;transition:.18s}
.nc:hover{border-color:var(--ac);transform:translateY(-2px)}
.nt{font-size:13px;font-weight:800;margin-bottom:6px}.npx{font-size:12px;color:var(--mut);line-height:1.8;max-height:70px;overflow:hidden}
.nm2{font-size:10px;color:var(--mut);font-family:var(--mono);direction:ltr;text-align:left;margin-top:8px;opacity:.7}
.tsw{border:1px solid var(--brd);background:var(--inr);border-radius:12px;padding:9px 15px;font-size:12.5px;font-weight:700;color:var(--txt);display:inline-flex;gap:8px;align-items:center}
.tsw.on{border-color:var(--ac);color:var(--ac);background:var(--acd)}
.dot{width:15px;height:15px;border-radius:50%}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.66);backdrop-filter:blur(4px);display:none;z-index:100;padding:20px 14px;overflow-y:auto}
#modal.show{display:block}
.mbx{max-width:880px;margin:0 auto 40px;background:var(--srf);border:1px solid var(--brd);border-radius:18px;padding:22px;position:relative;animation:fu .3s both}
.mx{position:absolute;top:13px;left:13px;width:34px;height:34px;border-radius:10px;background:var(--inr);border:1px solid var(--brd);color:var(--mut)}
.mx:hover{color:var(--rd)}
#mT{font-size:18px;padding-inline-end:44px;word-break:break-word}
#mP{font-size:11px;color:var(--mut);font-family:var(--mono);direction:ltr;text-align:left;margin:4px 0 13px;word-break:break-all}
.mrw{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:15px}
.mc{background:var(--inr);border:1px solid var(--brd);border-radius:13px;padding:18px 20px;line-height:2.1;font-size:14px;margin-bottom:14px;overflow-wrap:break-word}
.mc h1{font-size:20px;color:var(--ac);margin:16px 0 8px}.mc h1:first-child{margin-top:0}
.mc h2{font-size:17px;margin:13px 0 6px}.mc h3{font-size:15px;margin:11px 0 4px}
.mc ul,.mc ol{padding-inline-start:24px}.mc li{margin:3px 0}
.mc code{background:var(--bg);padding:2px 7px;border-radius:6px;font-family:var(--mono);font-size:12px;color:var(--ac2);direction:ltr;display:inline-block}
.mc pre{background:var(--bg);border:1px solid var(--brd);border-radius:10px;padding:13px;overflow:auto;direction:ltr;text-align:left;margin:11px 0}
.mc pre code{background:none;padding:0}
.mc table{border-collapse:collapse;width:100%;margin:11px 0;display:block;overflow:auto}
.mc th,.mc td{border:1px solid var(--brd);padding:6px 11px;font-size:13px}
.mc blockquote{border-inline-start:3px solid var(--ac);padding-inline-start:13px;color:var(--mut);margin:10px 0}
.mc img{max-width:100%;border-radius:9px}
.mc.rawpre{font-family:var(--mono);font-size:12px;direction:ltr;text-align:left;white-space:pre-wrap;overflow:auto;max-height:70vh}
.mc iframe{width:100%;height:72vh;border:0;border-radius:9px;background:#fff}
.mc video,.mc audio{width:100%;border-radius:9px}
.mn label{font-size:13px;font-weight:800;display:block;margin-bottom:7px}.mn small{color:var(--mut);font-weight:400}
.sh{font-size:11.5px;color:var(--mut);min-height:16px;margin-top:5px}.sh.ok{color:var(--ac)}
.ld{text-align:center;color:var(--mut);padding:34px 0;font-size:13px}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--srf);border:1px solid var(--ac);color:var(--ac);padding:10px 22px;border-radius:12px;font-size:13px;font-weight:700;opacity:0;transition:.3s;z-index:200;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:860px){.side{width:auto;height:auto;position:static;flex-direction:row;align-items:center;padding:10px 13px;border-inline-end:none;border-bottom:1px solid var(--brd)}
.brand{padding:0}.brand small{display:none}.nav{flex-direction:row;overflow-x:auto;flex:1}.nav a{white-space:nowrap;padding:8px 11px}.sfoot{margin:0;border:none;padding:0}
#view{padding:16px 13px 60px}.top{padding:11px 13px}.bar{display:none}.fg{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
 <aside class="side">
  <div class="brand">🏹 HuntBoard<small>منصة متابعة مسارك</small></div>
  <nav class="nav">
   <a href="#/dashboard" data-r="dashboard">📊 لوحة التحكم</a>
   <a href="#/library" data-r="library">📚 مكتبة الملفات</a>
   <a href="#/notes" data-r="notes">✍️ شروحاتي</a>
   <a href="#/settings" data-r="settings">⚙️ الإعدادات</a>
  </nav>
  <div class="sfoot"><div class="ring" id="sRing" style="width:44px;height:44px"></div>
   <button class="ib" id="themeBtn" title="الثيم">🎨</button></div>
 </aside>
 <main>
  <div class="top"><div id="rt">لوحة التحكم</div>
   <button class="ib" id="tbRef" title="تحديث من GitHub">🔄</button>
   <a class="ib" id="tbGh" href="#" target="_blank" title="الريبو">📁</a>
  </div>
  <div id="view"><div class="ld">جاري التحميل…</div></div>
 </main>
</div>

<div id="modal"><div class="mbx">
 <button class="mx" id="mX">✕</button>
 <h3 id="mT"></h3><div id="mP"></div>
 <div class="mrw">
  <div class="seg" id="mSeg" data-path=""><button data-st="todo">مش بدأ</button><button data-st="doing">جاري</button><button data-st="done">تم ✓</button></div>
  <a class="btn sm" id="mEdit" href="#" target="_blank">✏️ تعديل</a>
  <a class="btn sm" id="mRaw" href="#" target="_blank">⬇️ Raw</a>
  <button class="btn sm" id="mRel">🔄 إعادة تحميل</button>
 </div>
 <div class="mc" id="mC"></div>
 <div class="mn"><label>✍️ شرحي الشخصي <small>(يُحفظ تلقائيًا — بكلامي أنت)</small></label>
  <textarea class="inp" id="mN" style="min-height:130px" placeholder="اكتب اللي فهمته بكلامك…"></textarea>
  <div class="sh" id="mH"></div></div>
</div></div>

<input type="file" id="impIn" accept=".json" hidden>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<script>
/* ══════ طبقات: CONFIG → STORE → GH → LIB → VIEWS → ROUTER ══════ */
const THEMES={emerald:"زمردي",ocean:"محيطي",sunset:"غروب",light:"نهاري"};
const LS="huntboard_v3";
let cfg={owner:"Majek7x",repo:"huntboard",branch:"main",token:"",theme:"emerald"};
let store={progress:{},notes:{},lastOpened:null,lastDone:null};
let filter="all",q="",LIB=null,modalPath=null;

function saveAll(){try{localStorage.setItem(LS,JSON.stringify({cfg,store}))}catch(e){}}
function loadAll(){try{const r=JSON.parse(localStorage.getItem(LS)||"null");if(r){cfg={...cfg,...r.cfg};store={...store,...r.store}}}catch(e){}}
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const pretty=n=>n.replace(/\.[^.]+$/,"").replace(/^\d+\s*[-_.]?\s*/,"").replace(/[-_]+/g," ").trim()||n;
const statusOf=p=>store.progress[p]||"todo";
const ghU=(...x)=>`https://github.com/${cfg.owner}/${cfg.repo}/${x.join("/")}`;
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove("show"),2200)}
function applyTheme(){document.body.dataset.theme=cfg.theme}

/* ─────────── أنواع الملفات ─────────── */
function kindOf(name){const e=(name.split(".").pop()||"").toLowerCase();
 if(["md","markdown"].includes(e))return"md";
 if(["png","jpg","jpeg","gif","webp","svg","bmp","ico","avif"].includes(e))return"img";
 if(e==="pdf")return"pdf";
 if(["mp4","webm","mov","mkv"].includes(e))return"vid";
 if(["mp3","wav","ogg","m4a"].includes(e))return"aud";
 if(["zip","rar","7z","gz","tar","exe","dll","bin","iso","apk","deb","dmg"].includes(e))return"bin";
 return"text"}
const KIND_ICON={md:"📝",img:"🖼️",pdf:"📕",vid:"🎬",aud:"🎧",bin:"📦",text:"📄"};
function fmtSize(b){if(!b&&b!==0)return"";if(b<1024)return b+" B";if(b<1048576)return(b/1024).toFixed(1)+" KB";return(b/1048576).toFixed(1)+" MB"}

/* ─────────── GH: طبقة GitHub الوحيدة ─────────── */
const memCache=new Map();
const GH={ttl:10*60*1000,
 headers(x={}){const h={...x};if(cfg.token)h.Authorization="Bearer "+cfg.token;return h},
 rawUrl(p){const e=p.split("/").map(encodeURIComponent).join("/");return`https://raw.githubusercontent.com/${cfg.owner}/${cfg.repo}/${encodeURIComponent(cfg.branch)}/${e}`},
 async api(u){const r=await fetch(u,{headers:this.headers()});if(!r.ok)throw new Error(r.status);return r.json()},
 async tree(){
  const ck=`hbt_${cfg.owner}/${cfg.repo}/${cfg.branch}`;
  try{const raw=sessionStorage.getItem(ck);if(raw){const{ts,data}=JSON.parse(raw);if(Date.now()-ts<this.ttl)return data}}catch(e){}
  const d=await this.api(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/git/trees/${encodeURIComponent(cfg.branch)}?recursive=1`);
  const files=(d.tree||[]).filter(t=>t.type==="blob")
   .filter(t=>!t.path.startsWith(".git/")&&!t.path.includes("/.git/")&&!t.path.startsWith("node_modules/")&&t.path!=="index.html")
   .map(t=>({path:t.path,size:t.size||0,name:t.path.split("/").pop()}))
   .sort((a,b)=>a.path.localeCompare(b.path,undefined,{numeric:true}));
  const out={files,truncated:!!d.truncated};
  try{sessionStorage.setItem(ck,JSON.stringify({ts:Date.now(),data:out}))}catch(e){}
  return out},
 async raw(p){
  if(memCache.has(p))return memCache.get(p);
  const r=await fetch(this.rawUrl(p),{headers:this.headers()});
  if(!r.ok)throw new Error(r.status);
  const t=await r.text();memCache.set(p,t);return t},
 async blobUrl(p){
  if(cfg.token){const r=await fetch(this.rawUrl(p),{headers:this.headers()});if(!r.ok)throw new Error(r.status);const b=await r.blob();return URL.createObjectURL(b)}
  return this.rawUrl(p)}
};
function invalidate(){memCache.clear();try{Object.keys(sessionStorage).filter(k=>k.startsWith("hbt_")).forEach(k=>sessionStorage.removeItem(k))}catch(e){}}

/* ─────────── بناء المكتبة (ديناميكية بالكامل) ─────────── */
async function buildLib(){
  const data=await GH.tree();
  const groups=new Map();   // مفتاح الفولدر ← ملفات
  for(const f of data.files){
    const dir=f.path.includes("/")?f.path.slice(0,f.path.lastIndexOf("/")):"";
    if(!groups.has(dir))groups.set(dir,[]);
    groups.get(dir).push(f);
  }
  const order=[...groups.keys()].sort((a,b)=>a.localeCompare(b));
  order.sort((a,b)=>(a===""?-1:b===""?1:0));
  LIB={groups:order.map(dir=>({dir,files:groups.get(dir)})),truncated:data.truncated,total:data.files.length};
  return LIB}
function stats(){let total=0,done=0,doing=0,notes=0;
 if(LIB)for(const g of LIB.groups)for(const f of g.files){total++;const s=statusOf(f.path);
  if(s==="done")done++;else if(s==="doing")doing++;
  if((store.notes[f.path]||"").trim())notes++}
 return{total,done,doing,notes,pct:total?Math.round(done/total*100):0}}
function ringHTML(sz,p){const r=(sz-10)/2,c=+(2*Math.PI*r).toFixed(2);
 return`<svg width="${sz}" height="${sz}"><circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="var(--inr)" stroke-width="7"/><circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="var(--ac)" stroke-width="7" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${(c*(1-p/100)).toFixed(2)}"/></svg><span style="font-size:${sz/5.5}px">${p}%</span>`}
function updateRing(){const s=stats();$("sRing").innerHTML=ringHTML(44,s.pct)}

/* ─────────── VIEWS ─────────── */
const Views={};

Views.dashboard={title:"📊 لوحة التحكم",
 async render(v){
  if(!cfg.owner||!cfg.repo){v.innerHTML=`<div class="vw"><div class="pnl" style="text-align:center;padding:40px 20px"><div style="font-size:42px;margin-bottom:10px">🏹</div><h2 style="margin-bottom:8px">اربط الريبو الأول</h2><p class="hint" style="margin-bottom:16px">المنصة بتقرأ أي ملفات ترفعها على الريبو — أي اسم، أي فولدر، أي صيغة.</p><a class="btn pri" href="#/settings" data-r="settings">⚙️ الإعدادات</a></div></div>`;return}
  v.innerHTML='<div class="ld">جاري قراءة الريبو…</div>';
  try{await buildLib()}catch(e){v.innerHTML=`<div class="vw"><div class="emp">تعذر قراءة الريبو (${esc(e.message)}) — راجع الإعدادات أو دوس 🔄</div></div>`;return}
  const s=stats();
  const last=store.lastOpened;const lf=last?LIB.groups.flatMap(g=>g.files).find(f=>f.path===last):null;
  const qts=["العمق في ثغرة واحدة يتفوق على السطح في خمسين.","اللي بيكتب بإيده بيفهمه بدماغه.","صيّاد بمنهجية يسبق صيّاد بحظ.","كل ملف ترفعه = خطوة موثقة في مسارك."];
  v.innerHTML=`<div class="vw">
   <div class="pnl hero"><div class="ring" id="hRing" style="width:126px;height:126px"></div>
    <div class="htxt"><h2>استمر يا صياد 🏹</h2>
     <div class="hint" style="margin-bottom:12px">${s.total?`عندك <b style="color:var(--ac)">${s.total}</b> ملف على الريبو — كمّل من حيث وقفت.`:"الريبو لسه فاضي — ارفع أي ملف وهتيجي هنا."}</div>
     ${lf?`<a class="btn pri" data-open="${esc(last)}" href="javascript:void(0)">▶ أكمل: ${esc(pretty(lf.name))}</a>`:`<a class="btn pri" href="#/library" data-r="library">📚 افتح المكتبة</a>`}
     <div class="hint" style="border-inline-start:3px solid var(--ac);padding-inline-start:11px;margin-top:13px;font-style:italic">"${qts[new Date().getDate()%qts.length]}"</div></div></div>
   <div class="sgrid">
    <div class="st g"><b>${s.done}</b><span>✅ مكتمل</span></div>
    <div class="st a"><b>${s.doing}</b><span>⚡ جاري</span></div>
    <div class="st bl"><b>${s.notes}</b><span>✍️ شروحات</span></div>
    <div class="st"><b>${s.total}</b><span>📦 ملفات الريبو</span></div></div>
   <div class="pnl"><h3>📈 تقدم الفولدرات</h3>
    ${LIB.groups.map(g=>{const d=g.files.filter(f=>statusOf(f.path)==="done").length;const p=Math.round(d/g.files.length*100);
     return`<a class="gb" href="#/library" data-r="library" style="text-decoration:none;color:inherit"><span>${g.dir?"📂":"🏠"}</span><span class="t">${esc(g.dir||"الجذر (ملفات برا فولدر)")} <small style="color:var(--mut);font-weight:400">(${d}/${g.files.length})</small></span><div class="bar"><i style="width:${p}%"></i></div><span class="pct">${p}%</span></a>`}).join("")}
   </div>
   ${LIB.truncated?'<div class="emp">⚠️ الريبو كبير جدًا — العرض مقتطع جزئيًا من GitHub</div>':""}</div>`;
  $("hRing").innerHTML=ringHTML(126,s.pct);updateRing()}};

Views.library={title:"📚 مكتبة الملفات",
 async render(v){
  if(!cfg.owner||!cfg.repo){location.hash="#/settings";return}
  v.innerHTML='<div class="ld">جاري قراءة الريبو…</div>';
  try{await buildLib()}catch(e){v.innerHTML=`<div class="vw"><div class="emp">تعذر القراءة (${esc(e.message)})</div></div>`;return}
  v.innerHTML=`<div class="vw">
   <div class="tools"><input class="inp" id="q" placeholder="🔎 ابحث باي جزء من الاسم أو المسار…" value="${esc(q)}">
    <button class="chip ${filter==="all"?"on":""}" data-f="all">الكل</button>
    <button class="chip ${filter==="todo"?"on":""}" data-f="todo">مش بدأ</button>
    <button class="chip ${filter==="doing"?"on":""}" data-f="doing">جاري</button>
    <button class="chip ${filter==="done"?"on":""}" data-f="done">تم ✓</button>
    <button class="chip ${filter==="noted"?"on":""}" data-f="noted">✍️ فيه شرح</button>
    <a class="btn sm" href="${ghU("new",cfg.branch)}" target="_blank">➕ ملف جديد</a></div>
   <div id="gl"></div>
   ${LIB.truncated?'<div class="emp">⚠️ العرض مقتطع — الريبو ضخم</div>':""}</div>`;
  $("q").oninput=e=>{q=e.target.value;drawGroups()};
  drawGroups();updateRing()}};

function drawGroups(){
  const el=$("gl");if(!el||!LIB)return;
  el.innerHTML=LIB.groups.map((g,gi)=>{
    let list=g.files;
    if(q)list=list.filter(f=>f.path.toLowerCase().includes(q.toLowerCase()));
    if(filter==="noted")list=list.filter(f=>(store.notes[f.path]||"").trim());
    else if(filter!=="all")list=list.filter(f=>statusOf(f.path)===filter);
    const d=g.files.filter(f=>statusOf(f.path)==="done").length,p=Math.round(d/g.files.length*100);
    const open=gi===0||g.files.some(f=>statusOf(f.path)==="doing");
    const body=list.length?list.map(f=>{const st=statusOf(f.path);const k=kindOf(f.name);
      return`<div class="row ${st}"><span class="ric">${KIND_ICON[k]}</span>
       <div class="rm" data-open="${esc(f.path)}"><div class="rn">${esc(pretty(f.name))}</div><div class="rp">${esc(f.path)}${f.size?" • "+fmtSize(f.size):""}</div></div>
       <div>${(store.notes[f.path]||"").trim()?'<span class="bdg note">✍️</span>':""}${st==="done"?'<span class="bdg done">✓</span>':st==="doing"?'<span class="bdg doing">⚡</span>':""}</div>
       <div class="seg" data-path="${esc(f.path)}"><button data-st="todo" class="${st==="todo"?"on":""}">مش بدأ</button><button data-st="doing" class="${st==="doing"?"on":""}">جاري</button><button data-st="done" class="${st==="done"?"on":""}">تم</button></div>
       <a class="ib" style="width:30px;height:30px;font-size:13px" href="${ghU("edit",cfg.branch,f.path)}" target="_blank">✏️</a></div>`}).join("")
     :`<div class="emp">مفيش ملفات مطابقة هنا</div>`;
    return`<section class="grp ${open?"":"cl"}">
     <div class="gh"><span class="chev">▾</span><span class="gi">${g.dir?"📂":"🏠"}</span>
      <div class="gi2"><b>${esc(g.dir||"الجذر — ملفات برا فولدر")}</b><small>${g.files.length} ملف</small></div>
      <div class="bar"><i style="width:${p}%"></i></div><span class="pct">${p}%</span></div>
     <div class="gb2">${body}</div></section>`}).join("");
}

Views.notes={title:"✍️ شروحاتي",
 async render(v){
  const en=Object.entries(store.notes).filter(([p,t])=>t&&t.trim());
  v.innerHTML=`<div class="vw">${en.length?
   `<p class="hint" style="margin-bottom:13px">عندك <b style="color:var(--ac)">${en.length}</b> شرح — دي أثمن حاجة مكتوبة عندك.</p>
    <div class="ngrid">${en.map(([p,t])=>`<div class="nc" data-open="${esc(p)}"><div class="nt">📄 ${esc(pretty(p.split("/").pop()))}</div><div class="npx">${esc(t.slice(0,150))}…</div><div class="nm2">${esc(p)}</div></div>`).join("")}</div>`
   :`<div class="emp" style="text-align:center;padding:40px">لسه مفيش شروحات ✍️<br><b>افتح أي ملف من المكتبة واكتب شرحك تحت المحتوى</b> — هيظهر هنا.</div>`}</div>`;
  updateRing()}};

Views.settings={title:"⚙️ الإعدادات",
 async render(v){
  v.innerHTML=`<div class="vw">
   <div class="pnl"><h3>🔗 الريبو</h3>
    <p class="hint" style="margin-bottom:12px">المنصة بتقرأ <b>كل الملفات</b> في الريبو مهما كان اسمها أو مكانها أو صيغتها. الريبو لازم يكون <b>Public</b>، أو حط توكن (Contents: Read-only) لو Private.</p>
    <div class="fg">
     <div><label>OWNER</label><input class="inp" id="cO" value="${esc(cfg.owner)}"></div>
     <div><label>REPO</label><input class="inp" id="cR" value="${esc(cfg.repo)}"></div>
     <div><label>Branch</label><input class="inp" id="cB" value="${esc(cfg.branch)}"></div>
     <div><label>توكن (اختياري)</label><input class="inp" id="cT" type="password" value="${esc(cfg.token)}" placeholder="github_pat_…"></div></div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
     <button class="btn pri" id="cSave">💾 حفظ</button><button class="btn" id="cTest">🔌 اختبار الاتصال</button><span id="cOut" class="hint"></span></div></div>
   <div class="pnl"><h3>🎨 المظهر</h3><div style="display:flex;gap:10px;flex-wrap:wrap">
    ${Object.entries(THEMES).map(([k,n])=>`<button class="tsw ${cfg.theme===k?"on":""}" data-th="${k}"><span class="dot" data-d="${k}"></span>${n}</button>`).join("")}</div></div>
   <div class="pnl"><h3>💾 بياناتك</h3><p class="hint" style="margin-bottom:10px">التقدم والشروحات محفوظة في المتصفح — اعمل نسخة احتياطية بانتظام.</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
     <button class="btn pri sm" id="cEx">⬇️ نسخة احتياطية</button><button class="btn sm" id="cIm">⬆️ استيراد</button><button class="btn dng sm" id="cRs">🗑️ مسح الكل</button></div></div>
   <div class="pnl"><h3>🧩 التطوير</h3><p class="hint" style="margin:0">• ملف جديد يظهر: ارفعه على الريبو بأي اسم → 🔄<br>• ثيم جديد: بلوك CSS <code>body[data-theme=x]</code> + سطر في THEMES<br>• View جديد: <code>Views.name={title,render}</code> + لينك في الـ side<br>• الطبقات: GH (API) / store (بيانات) / Views (عرض) — كل واحدة لوحدها</p></div></div>`;
  const dm={emerald:["#34d399","#22d3ee"],ocean:["#38bdf8","#818cf8"],sunset:["#fb7185","#c084fc"],light:["#0aa678","#0369a1"]};
  document.querySelectorAll(".dot").forEach(d=>{const[a,b]=dm[d.dataset.d];d.style.background=`linear-gradient(135deg,${a},${b})`});
  $("cSave").onclick=()=>{cfg.owner=$("cO").value.trim();cfg.repo=$("cR").value.trim();cfg.branch=$("cB").value.trim()||"main";cfg.token=$("cT").value.trim();saveAll();invalidate();location.hash="#/dashboard";renderRoute();toast("✅ اتحفظ")};
  $("cTest").onclick=async()=>{const o=$("cOut");o.textContent="… جاري";
   try{const r=await GH.api("https://api.github.com/rate_limit");o.textContent=`✅ متصل — المتبقي ${r.rate.remaining}/${r.rate.limit}`}
   catch(e){o.textContent=e.message==="401"?"❌ توكن غلط":e.message==="404"?"❌ الريبو مش موجود/خاص بدون توكن":"❌ فشل الاتصال"}};
  $("cEx").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify({cfg,store},null,2)],{type:"application/json"}));a.download="huntboard-backup-"+new Date().toISOString().slice(0,10)+".json";a.click();toast("⬇️ نزّلت")};
  $("cIm").onclick=()=>$("impIn").click();
  $("cRs").onclick=()=>{if(confirm("مسح كل التقدم والشروحات والإعدادات؟")&&confirm("متأكد؟ آخر فرصة")){localStorage.removeItem(LS);location.reload()}};
  updateRing()}};

/* ─────────── ROUTER ─────────── */
async function renderRoute(){
  let r=(location.hash||"#/dashboard").replace(/^#\//,"");if(!Views[r])r="dashboard";
  document.querySelectorAll(".nav a").forEach(a=>a.classList.toggle("on",a.dataset.r===r));
  $("rt").textContent=Views[r].title;
  $("tbGh").href=cfg.owner?ghU(""):"#";
  const v=$("view");
  try{await Views[r].render(v)}catch(e){v.innerHTML=`<div class="emp">خطأ: ${esc(e.message)}</div>`}
  updateRing()}
window.addEventListener("hashchange",renderRoute);

/* ─────────── المودال: عارض كل الصيغ ─────────── */
async function openFile(path){
  modalPath=path;store.lastOpened=path;saveAll();
  const f=LIB?.groups.flatMap(g=>g.files).find(x=>x.path===path);
  const name=path.split("/").pop();
  $("mT").textContent=(KIND_ICON[kindOf(name)]||"📄")+" "+pretty(name);
  $("mP").textContent=path+(f&&f.size?" — "+fmtSize(f.size):"");
  $("mEdit").href=ghU("edit",cfg.branch,path);
  $("mRaw").href=GH.rawUrl(path);
  $("mSeg").dataset.path=path;segSync();
  $("mN").value=store.notes[path]||"";$("mH").textContent="";
  const box=$("mC");box.innerHTML='<div class="ld">جاري التحميل…</div>';
  $("modal").classList.add("show");
  const k=kindOf(name);
  try{
    if(k==="md"){const md=await GH.raw(path);box.innerHTML=DOMPurify.sanitize(marked.parse(md,{breaks:true}));box.querySelectorAll("a").forEach(a=>{a.target="_blank";a.rel="noopener"})}
    else if(k==="img"){box.innerHTML=`<img src="${GH.rawUrl(path)}" alt="">`}
    else if(k==="pdf"){box.innerHTML=`<iframe src="${GH.rawUrl(path)}"></iframe><p class="hint" style="margin-top:8px">لو الـ PDF ظهر غلط → نزّله من زرار ⬇️ Raw</p>`}
    else if(k==="vid"){box.innerHTML=`<video controls src="${GH.rawUrl(path)}"></video>`}
    else if(k==="aud"){box.innerHTML=`<audio controls src="${GH.rawUrl(path)}"></audio>`}
    else if(k==="bin"){box.innerHTML=`<div class="emp" style="text-align:center">📦 ملف ثنائي — المتصفح بيعرضهوش<br><a class="btn sm" style="margin-top:8px" href="${GH.rawUrl(path)}" target="_blank">⬇️ فتح/تحميل</a></div>`}
    else{ // نص / كود / أي حاجة تانية
      if(f&&f.size>1.5*1024*1024){box.innerHTML=`<div class="emp" style="text-align:center">الملف كبير (${fmtSize(f.size)}) — <a href="${GH.rawUrl(path)}" target="_blank">افتحه Raw</a></div>`}
      else{const t=await GH.raw(path);box.classList.add("rawpre");box.textContent=t;setTimeout(()=>box.classList.remove("rawpre"),0);box.classList.add("rawpre")}}
  }catch(e){box.innerHTML=`<div class="emp">تعذر التحميل (${esc(e.message)}) — دوس 🔄 إعادة تحميل</div>`}}
function segSync(){const s=statusOf(modalPath);document.querySelectorAll("#mSeg button").forEach(b=>b.classList.toggle("on",b.dataset.st===s))}
function closeModal(){$("modal").classList.remove("show");modalPath=null;renderRoute()}

/* ─────────── الأحداث ─────────── */
document.addEventListener("click",e=>{
  const t=e.target;
  const nav=t.closest("[data-r]");if(nav){e.preventDefault();location.hash="#/"+nav.dataset.r;return}
  const op=t.closest("[data-open]");if(op){openFile(op.dataset.open);return}
  const sb=t.closest(".seg button");
  if(sb){const p=sb.closest(".seg").dataset.path;
    if(sb.dataset.st==="done")store.lastDone=Date.now();
    store.progress[p]=sb.dataset.st;saveAll();
    if(modalPath===p)segSync();renderRoute();return}
  const fc=t.closest("[data-f]");if(fc){filter=fc.dataset.f;document.querySelectorAll("[data-f]").forEach(x=>x.classList.toggle("on",x===fc));drawGroups();return}
  const th=t.closest("[data-th]");if(th){cfg.theme=th.dataset.th;saveAll();applyTheme();renderRoute();return}
  if(t.closest("#themeBtn")){const ks=Object.keys(THEMES);cfg.theme=ks[(ks.indexOf(cfg.theme)+1)%ks.length];saveAll();applyTheme();renderRoute();return}
  const hd=t.closest(".gh");if(hd){hd.closest(".grp").classList.toggle("cl");return}
  if(t.closest("#mRel")&&modalPath){memCache.delete(modalPath);openFile(modalPath);return}
  if(t.closest("#mX")||t.id==="modal"){closeModal();return}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("modal").classList.contains("show"))closeModal()});
 $("tbRef").onclick=()=>{invalidate();renderRoute();toast("🔄 اتحمّل من الريبو")};
 $("mN").oninput=e=>{if(!modalPath)return;store.notes[modalPath]=e.target.value;saveAll();
  const h=$("mH");h.textContent="💾 اتحفظ";h.classList.add("ok");clearTimeout(window._nh);window._nh=setTimeout(()=>h.textContent="",1400)};
 $("impIn").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const j=JSON.parse(r.result);if(j.cfg)cfg={...cfg,...j.cfg};if(j.store)store={...store,...j.store};saveAll();applyTheme();invalidate();renderRoute();toast("⬆️ اترستوردت")}catch(x){toast("❌ ملف غلط")}};r.readAsText(f)};

/* ─────────── INIT ─────────── */
loadAll();applyTheme();renderRoute();
window.HuntBoard={Views,cfg,store,GH};
</script>
</body>
</html>
